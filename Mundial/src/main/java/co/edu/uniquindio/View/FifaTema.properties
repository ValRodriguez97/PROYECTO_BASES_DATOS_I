# -- FIFA World Cup 2026 Temas --

@accentPurple: #4A148C
@accentBlue: #0066FF
@accentTurquoise: #00BFA5
@accentMagenta: #E91E63
@accentRed: #FF1744

# Colores base
@background: #F5F7FA
@sidebarBg: #1A1A2E
@sidebarText: #FFFFFF
@cardBg: #FFFFFF
@textPrimary: #1A1A2E
@textSecondary: #64748B
@borderColor: rgba(0,0,0,0.08)

# Component overrides
[light]
background = @background
foreground = @textPrimary
selectionBackground = @accentPurple
selectionForeground = #FFFFFF
disabledBackground = #E8EAF0
disabledForeground = @textSecondary

Button.background = @accentPurple
Button.foreground = #FFFFFF
Button.hoverBackground = #6A1FAC
Button.pressedBackground = #380F6A
Button.arc = 8
Button.borderWidth = 0
Button.focusedBorderColor = @accentPurple

Table.background = @cardBg
Table.alternateRowColor = #F8F9FC
Table.selectionBackground = #EDE7F6
Table.selectionForeground = @accentPurple
Table.gridColor = #EAECF0
Table.showHorizontalLines = true
Table.showVerticalLines = false

TableHeader.background = #F1F3F7
TableHeader.foreground = @textPrimary
TableHeader.separatorColor = #DCDFE6

Panel.background = @background
ScrollPane.background = @background

TextField.background = @cardBg
TextField.border = 1,8,1,8,@borderColor,0,6,6
TextField.focusedBorderColor = @accentPurple
TextField.hoverBorderColor = @accentBlue

ComboBox.background = @cardBg
ComboBox.focusedBorderColor = @accentPurple

List.background = @cardBg
List.selectionBackground = #EDE7F6
List.selectionForeground = @accentPurple

ProgressBar.foreground = @accentPurple
ProgressBar.background = #E8EAF0

Separator.foreground = @borderColor

TabbedPane.selectedBackground = @cardBg
TabbedPane.hoverColor = #EDE7F6
TabbedPane.focusColor = #EDE7F6
TabbedPane.underlineColor = @accentPurple

ScrollBar.width = 8
ScrollBar.thumb = #CBD5E1
ScrollBar.hoverThumb = #94A3B8